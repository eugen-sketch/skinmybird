name: Oil backtest

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de rulat din etoro-autotrader (ex: research_fx.py)"
        default: "research_fx.py"
      test_trade:
        description: "Deschide si inchide o pozitie minima de test pe DEMO (doar etoro_check.py)"
        default: "0"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Run script
        working-directory: etoro-autotrader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          TEST_TRADE: ${{ inputs.test_trade || '0' }}
          QUIET_LOGS: "1"
        run: python ${{ inputs.script || 'research_fx.py' }}
