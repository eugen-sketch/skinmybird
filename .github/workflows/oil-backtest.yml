name: Unelte (teste si verificari)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de rulat din etoro-assistant (ex: research_fx.py)"
        default: "research_fx.py"
      arg:
        description: "Argument pentru script (ex: numele nou al botului)"
        default: ""
      hours:
        description: "Doar pentru assistant.py: cate ore ramane pornit"
        default: "0.05"
      verbose:
        description: "Afiseaza raspunsurile eToro (doar pentru depanare)"
        default: "0"
      check_symbols:
        description: "Simboluri eToro de cautat (etoro_check.py)"
        default: "OIL,GOLD,EURUSD"
      check_search:
        description: "Prefixe de afisat candidati (etoro_check.py)"
        default: "OIL,GOLD"
      test_trade:
        description: "Deschide si inchide o pozitie minima de test pe DEMO (doar etoro_check.py)"
        default: "0"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Run script
        working-directory: etoro-assistant
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          TEST_TRADE: ${{ inputs.test_trade || '0' }}
          QUIET_LOGS: "1"
          SCRIPT_ARG: ${{ inputs.arg }}
          SESSION_HOURS: ${{ inputs.hours || '0.05' }}
          ETORO_VERBOSE: ${{ inputs.verbose || '0' }}
          CHECK_SYMBOLS: ${{ inputs.check_symbols || 'OIL,GOLD,EURUSD' }}
          CHECK_SEARCH: ${{ inputs.check_search || 'OIL,GOLD' }}
        run: python ${{ inputs.script || 'research_fx.py' }}
