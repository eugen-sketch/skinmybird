name: Oil signals

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Trimite un mesaj de test pe Telegram"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Restore last signal state
        uses: actions/cache@v4
        with:
          path: oil-signal-bot/state.json
          key: oil-state-${{ github.run_id }}
          restore-keys: oil-state-
      - name: Check oil and notify
        working-directory: oil-signal-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_message }}" = "true" ]; then python oilbot.py --test; fi
          python oilbot.py --once
