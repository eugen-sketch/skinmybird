name: Oil signals

on:
  schedule:
    - cron: "*/15 * * * 0-5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Restore last signal state
        uses: actions/cache@v4
        with:
          path: oil-signal-bot/state.json
          key: oil-state-${{ github.run_id }}
          restore-keys: oil-state-
      - name: Check oil and notify
        working-directory: oil-signal-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oilbot.py --once
