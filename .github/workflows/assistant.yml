name: Asistent trading (îl pornești tu)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Cât timp rămâne pornit, în ore (peste 5.5 ore se pornește automat o sesiune nouă)"
        default: "5"
      continued:
        description: "Folosit automat la continuare (nu-l atinge)"
        default: "0"
      mode:
        description: "demo (implicit) sau real (bani adevărați, doar la cererea ta)"
        default: "demo"
      aggressive:
        description: "true = AGGRESSIVE_MODE (mai multe semnale, expunere mai mare); implicit false."
        default: "false"

permissions:
  contents: read
  actions: write

concurrency:
  group: assistant
  cancel-in-progress: true

jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy matplotlib tzdata cryptography
      - name: Restore state (castig realizat intre sesiuni)
        continue-on-error: true
        working-directory: etoro-assistant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=assistant-state${{ inputs.mode == 'real' && '-real' || '' }}&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > state.zip && unzip -o -q state.zip && rm -f state.zip
          fi
      - name: Run assistant
        working-directory: etoro-assistant
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_REAL_API_KEY: ${{ secrets.ETORO_REAL_API_KEY }}
          ETORO_REAL_USER_KEY: ${{ secrets.ETORO_REAL_USER_KEY }}
          HELGA_KEY: ${{ secrets.HELGA_KEY }}
          TRADING_MODE: ${{ inputs.mode }}
          AGGRESSIVE_MODE: ${{ inputs.aggressive }}
          QUIET_LOGS: "1"
          SESSION_HOURS: ${{ inputs.hours }}
          CONTINUED: ${{ inputs.continued }}
        run: python assistant.py
      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-state${{ inputs.mode == 'real' && '-real' || '' }}
          path: etoro-assistant/state${{ inputs.mode == 'real' && '-real' || '' }}.json
          overwrite: true
          retention-days: 30
          if-no-files-found: ignore
      - name: Save journal (criptat, doar cu HELGA_KEY se poate citi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-journal-${{ github.run_id }}
          path: etoro-assistant/journal.enc
          retention-days: 3
          if-no-files-found: ignore
      - name: Continue in a new session if hours remain
        working-directory: etoro-assistant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f handover.txt ]; then
            gh workflow run assistant.yml --ref master -f hours="$(cat handover.txt)" -f continued=1 -f mode="${{ inputs.mode }}" -f aggressive="${{ inputs.aggressive }}"
          fi
